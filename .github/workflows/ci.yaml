name: voice-agent
on:
  push:
    branches:
      - develop
      - main
      - stage



jobs:
  Linting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python 3.13.4
      uses: actions/setup-python@v2
      with:
        python-version: '3.13.14'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: |
        flake8 main.py

  testing:
    needs: linting
    runs-on: ubuntu-latest

    steps:

      - name: code checkout
        uses: actions/checkout@v3

      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.13.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build Docker image
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 276460185644.dkr.ecr.us-east-1.amazonaws.com
          docker build -t voice-agent:v1 .

      - name: Push Docker image to ECR
        run: |
          docker tag voice-agent:v1 276460185644.dkr.ecr.us-east-1.amazonaws.com/voice-agent:v1
          docker push 276460185644.dkr.ecr.us-east-1.amazonaws.com/voice-agent:v1