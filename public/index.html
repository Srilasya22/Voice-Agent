<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Transcription</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --accent: #13ef93;
      --accent-ink: #04301f;
      --danger: #dc2626;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e8ebf1;
        --muted: #9aa3b2;
        --border: #2a2f3a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8ebf1;
      --muted: #9aa3b2;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    main {
      width: 100%;
      max-width: 720px;
      padding-top: 32px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 999px;
      padding: 10px 20px;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-ink);
    }
    button.stop { background: var(--danger); color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .status.live .dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(19, 239, 147, 0.25); }
    .status.error { color: var(--danger); }
    .status.error .dot { background: var(--danger); }
    #transcript {
      min-height: 180px;
      font-size: 1.1rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    #transcript:empty::before {
      content: "Press Start and speak. Your words will appear here.";
      color: var(--muted);
    }
    .interim { color: var(--muted); font-style: italic; }
    .footer { display: flex; justify-content: space-between; margin-top: 12px; }
    .link { background: none; color: var(--muted); padding: 0; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>Live Transcription</h1>
    <p class="subtitle">Speech-to-text powered by Deepgram</p>

    <div class="card">
      <div class="controls">
        <button id="toggle">Start</button>
        <div id="status" class="status"><span class="dot"></span><span id="statusText">Idle</span></div>
      </div>
      <div id="transcript"></div>
      <div class="footer">
        <span></span>
        <button id="clear" class="link">Clear</button>
      </div>
    </div>
  </main>

  <script>
    const toggleBtn = document.getElementById("toggle");
    const clearBtn = document.getElementById("clear");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const transcriptEl = document.getElementById("transcript");

    let socket = null;
    let recorder = null;
    let stream = null;
    let finalText = "";
    let interimText = "";

    function setStatus(text, state = "") {
      statusText.textContent = text;
      statusEl.className = "status " + state;
    }

    function render() {
      transcriptEl.textContent = "";
      transcriptEl.append(finalText);
      if (interimText) {
        const span = document.createElement("span");
        span.className = "interim";
        span.textContent = (finalText ? " " : "") + interimText;
        transcriptEl.append(span);
      }
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function appendFinal(text) {
      finalText = (finalText + " " + text).trim();
      interimText = "";
    }

    function pickMimeType() {
      const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
      return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    async function start() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        setStatus("Microphone access denied", "error");
        return;
      }

      const protocol = location.protocol === "https:" ? "wss" : "ws";
      socket = new WebSocket(`${protocol}://${location.host}/ws/transcribe`);

      socket.onopen = () => {
        const mimeType = pickMimeType();
        recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        recorder.ondataavailable = (event) => {
          if (event.data.size > 0 && socket && socket.readyState === WebSocket.OPEN) {
            socket.send(event.data);
          }
        };
        recorder.onstop = () => {
          if (socket && socket.readyState === WebSocket.OPEN) socket.send("stop");
        };
        recorder.start(250);
        toggleBtn.textContent = "Stop";
        toggleBtn.classList.add("stop");
        setStatus("Listening…", "live");
      };

      socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "transcript") {
          if (msg.is_final) {
            appendFinal(msg.text);
          } else {
            interimText = msg.text;
          }
          render();
        } else if (msg.type === "error") {
          setStatus(msg.message, "error");
        }
      };

      socket.onclose = () => {
        teardownMedia();
        if (interimText) appendFinal(interimText);
        render();
        if (!statusEl.classList.contains("error")) setStatus("Idle");
        toggleBtn.textContent = "Start";
        toggleBtn.classList.remove("stop");
        toggleBtn.disabled = false;
        socket = null;
      };

      socket.onerror = () => setStatus("Connection error", "error");
    }

    function teardownMedia() {
      if (recorder && recorder.state !== "inactive") recorder.stop();
      recorder = null;
      if (stream) stream.getTracks().forEach((track) => track.stop());
      stream = null;
    }

    function stop() {
      toggleBtn.disabled = true;
      setStatus("Finishing…");
      if (recorder && recorder.state !== "inactive") {
        recorder.stop(); // onstop sends "stop" so the server flushes final results
      } else if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send("stop");
      } else if (socket) {
        socket.close();
      }
    }

    toggleBtn.addEventListener("click", () => {
      if (socket) {
        stop();
      } else {
        finalText = "";
        interimText = "";
        render();
        start();
      }
    });

    clearBtn.addEventListener("click", () => {
      finalText = "";
      interimText = "";
      render();
    });

    render();
  </script>
</body>
</html>
